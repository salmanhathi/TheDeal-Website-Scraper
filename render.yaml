services:
  - type: web
    name: product-availability-checker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 300
    envVars:
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SCHEDULE_HOUR
        value: "8"
      - key: SCHEDULE_MINUTE
        value: "0"
      - key: SEND_EMAIL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
